name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

jobs:
  test-lanes:
    name: Tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Four disjoint shards; tests/test_ci_workflow.py checks that each test file runs in exactly one.
        lane: [runner-v3, m4-pipelines, core, diagnostics]
    # Repository tests use committed synthetic fixtures only.
    # This job is not result-bearing and does not read a private panel.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The handoff freshness test resolves its checkpoint in full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only a pull request can be docs-only; push and merge_group runs always get the full suite.
          # On a pull_request event HEAD is the merge commit, so HEAD^1 is the base tip.
          # --no-renames lists both paths of a rename. An error while listing gives the full scope.
          scope=full
          if [ "$EVENT_NAME" = pull_request ] && changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            scope="$(printf '%s\n' "$changed" | python scripts/ci_change_scope.py)" || scope=full
          fi
          echo "Change scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev]"

      - name: Record validation environment
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-evidence/checkout-sha.txt"
          python --version > "$RUNNER_TEMP/ci-evidence/python.txt"
          python -m pip freeze --all > "$RUNNER_TEMP/ci-evidence/dependencies.txt"
          # Plain nproc honors OMP_NUM_THREADS=1; --all reports the runner vCPU count.
          nproc --all > "$RUNNER_TEMP/ci-evidence/cpus.txt"
          free -m > "$RUNNER_TEMP/ci-evidence/memory-start.txt"
          python -m threadpoolctl -i numpy scipy sklearn > "$RUNNER_TEMP/ci-evidence/threadpools.json"

      - name: Lint repository
        if: matrix.lane == 'core'
        run: python -m ruff check .

      - name: Compile source, tests, and research scripts
        if: matrix.lane == 'core'
        run: python -m compileall src tests research

      - name: Compile LEAN scaffold files
        if: matrix.lane == 'core'
        run: python -m compileall lean

      - name: Build distribution
        if: matrix.lane == 'core'
        run: python -m build

      - name: Run tests
        env:
          CI_LANE: ${{ matrix.lane }}
          CHANGE_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          case "$CI_LANE" in
            runner-v3)
              selection=(tests/test_m4_8_runner_v3.py)
              ;;
            m4-pipelines)
              selection=(tests/test_m4_7_sp500_pit_rerun.py tests/test_m4_8_integration_v3.py)
              ;;
            core)
              selection=(tests
                --ignore=tests/test_m4_8_runner_v3.py
                --ignore=tests/test_m4_7_sp500_pit_rerun.py
                --ignore=tests/test_m4_8_integration_v3.py
                --ignore=tests/test_multifactor_diagnostic_mvp.py
                --ignore=tests/test_m3_10_hardening.py)
              ;;
            diagnostics)
              selection=(tests/test_multifactor_diagnostic_mvp.py tests/test_m3_10_hardening.py)
              ;;
            *) exit 2 ;;
          esac
          # A docs-only change skips the tests marked slow. Every test file outside the core lane is
          # marked slow, which tests/test_ci_workflow.py checks.
          marker=()
          if [ "$CHANGE_SCOPE" = docs-only ]; then
            if [ "$CI_LANE" != core ]; then
              echo "Docs-only change: every test in the $CI_LANE lane is marked slow, so this lane does not run pytest."
              exit 0
            fi
            marker=(-m "not slow")
          fi
          # loadgroup keeps each xdist_group (an expensive shared fixture) on one worker.
          /usr/bin/time -v -o "$RUNNER_TEMP/ci-evidence/pytest-resource.txt" \
            python -m pytest -q -n auto --dist loadgroup \
            --max-worker-restart=0 --durations=50 --durations-min=0.1 \
            --junitxml="$RUNNER_TEMP/ci-evidence/pytest.xml" \
            "${marker[@]}" "${selection[@]}" \
            2>&1 | tee "$RUNNER_TEMP/ci-evidence/pytest.log"

      - name: Verify tracked inputs stayed unchanged
        if: ${{ always() }}
        run: git diff --exit-code HEAD -- .

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 14
          if-no-files-found: warn

  validation:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-lanes]
    if: ${{ always() }}
    steps:
      - name: Require every test lane to pass
        env:
          LANES_RESULT: ${{ needs.test-lanes.result }}
        run: test "$LANES_RESULT" = success
